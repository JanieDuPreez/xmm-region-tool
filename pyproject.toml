[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "xmm-region-tool"
version = "0.1.0rc1"
description = "Convert DS9 sky regions to XMM-Newton EPIC detector-region selections"
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
dependencies = [
  "astropy>=6",
  "numpy>=1.26",
  "regions>=0.9",
]

[project.urls]
Repository = "https://github.com/JanieDuPreez/xmm-region-tool"

[project.optional-dependencies]
test = [
  "pytest>=8",
  "ruff>=0.8",
]

[project.scripts]
xmm-region = "xmm_region_tool.science_cli:main"
xmm-region-batch = "xmm_region_tool.science_batch_cli:main"
xmm-region-check = "xmm_region_tool.check_cli:main"
xmm-region-sas-validate = "xmm_region_tool.sas_validate_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/xmm_region_tool"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
